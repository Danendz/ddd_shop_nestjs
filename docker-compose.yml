services:
  mongodb:
    image: mongo:7.0.14
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  postgres:
    image: postgres:17
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ddd_shop
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'

volumes:
  mongodb_data:
  postgres_data:
